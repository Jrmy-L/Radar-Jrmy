technologies:

  # ── LANGUAGES ──────────────────────────────────────────────────────────────

  - id: typescript
    name: TypeScript
    category: languages
    position: adopt
    since: "2024-01"
    switching_cost: medium
    experience: operated
    evidence:
      - "Vill'Âge Jeunes : backend TypeScript déployé et exploité personnellement sur VPS"
    notes: "Standard de facto pour tout projet Node/web"
    pros:
      - "Typage statique = moins de bugs runtime"
      - "Auto-complétion et refactoring fiables"
      - "Compatible JS — migration progressive"
    cons:
      - "Build step supplémentaire"
      - "Types complexes (generics imbriqués) verbose"
      - "Fausse sécurité si any/as utilisés"
    use_cases:
      - "Tout projet Node.js ou frontend en équipe"
      - "APIs GraphQL, NestJS, Next.js"
      - "Librairies partagées nécessitant un contrat fort"
    sources:
      github: microsoft/TypeScript
      npm_package: typescript

  - id: java
    name: Java
    category: languages
    position: adopt
    since: "2024-01"
    switching_cost: high
    notes: "Langage backend mature, écosystème Spring solide"
    pros:
      - "JVM mature — performances prévisibles, tooling riche"
      - "Typage fort + refactoring IDE de classe mondiale"
      - "Écosystème Spring Boot / Quarkus très complet"
    cons:
      - "Verbosité comparée à Kotlin/Go"
      - "Démarrage JVM lent (vs GraalVM native)"
      - "Gestion mémoire heap à configurer en prod"
    use_cases:
      - "Microservices d'entreprise Spring Boot"
      - "Applications Android (avec Kotlin en priorité)"
      - "Systèmes haute disponibilité bancaires / assurance"
    sources:
      github: openjdk/jdk

  - id: python
    name: Python
    category: languages
    position: adopt
    since: "2024-01"
    switching_cost: medium
    experience: operated
    evidence:
      - "Système d'affichage dynamique : backend Python et automatisation crontab exploités"
    notes: "Scripting, data, ML/AI — polyvalence maximale"
    pros:
      - "Productivité maximale, syntaxe lisible"
      - "Écosystème ML/data science inégalé"
      - "Scripts d'automatisation et glue code rapides"
    cons:
      - "GIL — pas de vrai parallélisme CPU"
      - "Performances brutes faibles (PyPy/Cython pour critical path)"
      - "Typage dynamique = bugs runtime sans mypy"
    use_cases:
      - "Data pipelines, ML / LLM fine-tuning"
      - "Scripts DevOps, automatisation CI/CD"
      - "APIs FastAPI / Django pour équipes data"
    sources:
      github: python/cpython
      pypi_package: pip

  - id: go
    name: Go
    category: languages
    position: trial
    since: "2024-06"
    switching_cost: medium
    notes: "Langage de choix pour les outils cloud-native et microservices légers"
    pros:
      - "Goroutines légères — concurrence native et simple"
      - "Compilation rapide, binaires statiques autonomes"
      - "Performances proches du C sans gestion mémoire manuelle"
    cons:
      - "Gestion des erreurs verbose (if err != nil partout)"
      - "Pas d'exceptions — patterns inhabituels pour les développeurs Java/JS"
      - "Génériques arrivés tard (Go 1.18) — bibliothèques pas encore homogènes"
    use_cases:
      - "Microservices hautes performances (Kubernetes, Docker, Prometheus sont en Go)"
      - "CLI tools et agents de collecte de métriques"
      - "Proxies réseau, load balancers, edge services"
    sources:
      github: golang/go

  - id: rust
    name: Rust
    category: languages
    position: assess
    since: "2024-09"
    switching_cost: high
    notes: "Sécurité mémoire sans GC — pertinent pour les couches critiques de performance"
    pros:
      - "Memory safety garantie à la compilation (borrow checker)"
      - "Performances C++ sans garbage collector"
      - "WebAssembly de premier ordre"
    cons:
      - "Courbe d'apprentissage très abrupte (borrow checker)"
      - "Compilation lente sur les gros projets"
      - "Moins de développeurs disponibles sur le marché"
    use_cases:
      - "Composants WebAssembly embarqués dans des apps web"
      - "Outils CLI critiques remplaçant C/C++"
      - "Couches réseau ou cryptographiques haute performance"
    sources:
      github: rust-lang/rust

  # ── FRAMEWORKS FRONT ───────────────────────────────────────────────────────

  - id: react
    name: React
    category: frameworks_front
    position: adopt
    since: "2024-01"
    switching_cost: medium
    experience: studied
    evidence:
      - "Bases React acquises, sans preuve de livraison en production recensée"
    notes: "Dominant en production, écosystème Next.js solide"
    pros:
      - "Écosystème et communauté les plus larges"
      - "React Server Components — full-stack natif avec Next.js"
      - "Hooks + Context — state management flexible"
    cons:
      - "Bundle size si non optimisé"
      - "JSX — courbe pour les nouveaux développeurs"
      - "Choix de librairies à faire soi-même (pas opinionné)"
    use_cases:
      - "Applications web complexes en équipe"
      - "Sites e-commerce / marketing avec Next.js (SSR/SSG)"
      - "Dashboards et outils internes"
    sources:
      github: facebook/react
      npm_package: react

  - id: angular
    name: Angular
    category: frameworks_front
    position: trial
    since: "2024-03"
    switching_cost: high
    notes: "Framework complet, pertinent pour grandes applications d'entreprise"
    pros:
      - "Framework full-featured opinionné — cohérence en équipe"
      - "Injection de dépendances robuste, RxJS natif"
      - "TypeScript en premier — aucune configuration"
    cons:
      - "Verbosité et boilerplate important"
      - "Bundle initial lourd si non tree-shaken"
      - "Courbe d'apprentissage élevée pour les débutants"
    use_cases:
      - "Applications d'entreprise avec équipes larges"
      - "Portails internes nécessitant une architecture stricte"
      - "Migration depuis AngularJS en contexte existant"
    sources:
      github: angular/angular
      npm_package: "@angular/core"

  - id: vuejs
    name: Vue.js
    category: frameworks_front
    position: trial
    since: "2024-06"
    switching_cost: medium
    notes: "Alternative React plus accessible, Composition API élégante"
    pros:
      - "Courbe d'apprentissage douce — idéal pour onboarder des juniors"
      - "Composition API — réutilisabilité de la logique"
      - "Nuxt.js pour le SSR, intégration facile avec Laravel/Django"
    cons:
      - "Moins dominant qu'Angular en entreprise française"
      - "Écosystème plus petit que React"
      - "Deux paradigmes (Options API + Composition API) = confusion potentielle"
    use_cases:
      - "SPAs et dashboards avec équipes polyvalentes"
      - "Applications PHP/Laravel avec composants interactifs"
      - "Projets cherchant une alternative React plus progressive"
    sources:
      github: vuejs/core
      npm_package: vue

  - id: nextjs
    name: Next.js
    category: frameworks_front
    position: adopt
    since: "2024-03"
    switching_cost: medium
    notes: "Standard pour le SSR/SSG React — full-stack en un seul framework"
    pros:
      - "SSR, SSG, ISR en un seul framework sans config"
      - "App Router — Server Components, streaming, layouts"
      - "Optimisations images/fonts/scripts automatiques"
    cons:
      - "Vendor lock-in Vercel subtil (edge runtime, caching)"
      - "App Router — complexité du cache difficile à déboguer"
      - "Configuration avancée Webpack/Turbopack"
    use_cases:
      - "Sites e-commerce avec SEO critique"
      - "Applications full-stack React sans backend séparé"
      - "Portails marketing haute performance"
    sources:
      github: vercel/next.js
      npm_package: next

  - id: svelte
    name: Svelte
    category: frameworks_front
    position: assess
    since: "2024-09"
    switching_cost: medium
    notes: "Compilateur plutôt que runtime — bundle minimal, DX excellent"
    pros:
      - "Compilation à la build — pas de Virtual DOM en runtime"
      - "Bundle final ultra-léger"
      - "Syntaxe concise et réactive sans boilerplate"
    cons:
      - "Écosystème plus petit — moins de librairies tierces"
      - "Moins de développeurs disponibles sur le marché"
      - "SvelteKit encore en maturation pour les gros projets"
    use_cases:
      - "Widgets embarqués dans des apps existantes"
      - "Applications légères où la taille du bundle est critique"
      - "Projets expérimentaux ou applications internes à haute interactivité"
    sources:
      github: sveltejs/svelte
      npm_package: svelte

  # ── FRAMEWORKS BACK ────────────────────────────────────────────────────────

  - id: spring-boot
    name: Spring Boot
    category: frameworks_back
    position: adopt
    since: "2024-01"
    switching_cost: high
    notes: "Standard Java backend, auto-configuration, large écosystème"
    pros:
      - "Auto-configuration — zéro XML, prêt en quelques minutes"
      - "Écosystème Spring (Security, Data, Cloud) très complet"
      - "Production-ready : Actuator, metrics, health checks"
    cons:
      - "Démarrage lent (JVM) — améliorer avec GraalVM native"
      - "Consommation mémoire élevée par défaut"
      - "Magie Spring — debug complexe pour les non-experts"
    use_cases:
      - "Microservices d'entreprise Java"
      - "APIs REST / GraphQL avec Spring Data JPA"
      - "Services d'authentification avec Spring Security + Keycloak"
    sources:
      github: spring-projects/spring-boot

  - id: fastify
    name: Fastify
    category: frameworks_back
    position: adopt
    since: "2024-01"
    switching_cost: low
    experience: operated
    evidence:
      - "Vill'Âge Jeunes : API Fastify v5 déployée et exploitée personnellement sur VPS"
    notes: "Framework Node.js rapide, sobre et extensible, utilisé sur le projet de référence"
    pros:
      - "Validation et sérialisation JSON Schema intégrées"
      - "Architecture par plugins avec encapsulation explicite"
      - "Bonnes performances sans sacrifier la lisibilité"
    cons:
      - "Écosystème plus réduit qu'Express"
      - "L'encapsulation des plugins demande un apprentissage spécifique"
      - "Moins structurant que NestJS pour les très grandes équipes"
    use_cases:
      - "APIs TypeScript performantes et maintenables"
      - "Backends modulaires avec validation de contrats"
      - "Services Node.js nécessitant peu d'abstraction"
    sources:
      github: fastify/fastify
      npm_package: fastify

  - id: nestjs
    name: NestJS
    category: frameworks_back
    position: trial
    since: "2024-03"
    switching_cost: medium
    experience: studied
    evidence:
      - "Apprentissage en cours, sans projet livré recensé"
    notes: "Architecture modulaire Node.js, TypeScript natif"
    pros:
      - "Architecture Angular-like — familière pour les équipes front"
      - "TypeScript natif, décorateurs, injection de dépendances"
      - "Adapters Fastify / Express, WebSockets, gRPC out-of-the-box"
    cons:
      - "Overhead de décorateurs — verbose pour des APIs simples"
      - "Performances inférieures à Go/Rust pour le CPU-bound"
      - "Certains patterns Angular trop lourds pour des microservices"
    use_cases:
      - "APIs REST/GraphQL TypeScript en équipe full-stack"
      - "BFF (Backend For Frontend) dans un monorepo"
      - "Microservices Node.js nécessitant une architecture rigoureuse"
    sources:
      github: nestjs/nest
      npm_package: "@nestjs/core"

  - id: fastapi
    name: FastAPI
    category: frameworks_back
    position: adopt
    since: "2024-03"
    switching_cost: low
    notes: "Référence Python async — OpenAPI auto-généré, Pydantic natif"
    pros:
      - "OpenAPI / Swagger auto-généré à partir des types"
      - "Pydantic v2 — validation ultra-rapide"
      - "Async natif — performances comparables à Node.js"
    cons:
      - "Moins adapté aux grosses applications monolithiques"
      - "Gestion sessions / auth à assembler soi-même"
      - "Async peut complexifier le debug en cas d'erreur"
    use_cases:
      - "APIs ML/data science exposant des modèles Python"
      - "Microservices Python haute performance"
      - "Prototypes rapides avec documentation API gratuite"
    sources:
      github: fastapi/fastapi
      pypi_package: fastapi

  - id: quarkus
    name: Quarkus
    category: frameworks_back
    position: trial
    since: "2024-06"
    switching_cost: high
    notes: "Java cloud-native — démarrage sub-seconde avec GraalVM native image"
    pros:
      - "Démarrage ultra-rapide (~10ms en mode native)"
      - "Empreinte mémoire minimale — idéal pour K8s / Serverless"
      - "Dev mode avec hot reload et Live Coding"
    cons:
      - "Compilation native GraalVM longue (5-15 min)"
      - "Extensions pas toutes aussi stables que Spring"
      - "Courbe d'apprentissage pour les équipes Spring habituées"
    use_cases:
      - "Microservices Java containerisés à scalabilité rapide"
      - "Fonctions serverless (AWS Lambda, Azure Functions)"
      - "Remplacement de Spring Boot là où le cold start est critique"
    sources:
      github: quarkusio/quarkus

  - id: expressjs
    name: Express.js
    category: frameworks_back
    position: adopt
    since: "2024-01"
    switching_cost: low
    notes: "Framework Node.js minimaliste — référence pour les APIs simples"
    pros:
      - "Minimaliste et flexible — aucun avis imposé"
      - "Écosystème middleware npm immense"
      - "Apprentissage en quelques heures"
    cons:
      - "Pas opinionné — incohérence architecturale en équipe"
      - "Maintenance ralentie (dernière version majeure en 2014)"
      - "Callback hell sans async/await explicite"
    use_cases:
      - "APIs REST simples et BFF légers"
      - "Prototypes Node.js rapides"
      - "Middleware servers et reverse proxies custom"
    sources:
      github: expressjs/express
      npm_package: express

  # ── MOBILE ─────────────────────────────────────────────────────────────────

  - id: flutter
    name: Flutter
    category: mobile
    position: adopt
    since: "2024-01"
    switching_cost: high
    experience: practiced
    evidence:
      - "Système d'affichage dynamique : première architecture Flutter prototypée avant pivot ESP32"
    notes: "Cross-platform iOS/Android/Web avec une seule codebase Dart"
    pros:
      - "UI 100% custom — pixel-perfect sur toutes les plateformes"
      - "Hot reload ultra-rapide en développement"
      - "Performance native via compilation AOT"
    cons:
      - "Dart — langage à apprendre, pool de développeurs limité"
      - "Bundle size plus lourd qu'une app native"
      - "Accès aux APIs platform-specific nécessite des plugins"
    use_cases:
      - "Applications mobiles cross-platform avec UI riche"
      - "Apps avec design system fortement customisé"
      - "Équipes cherchant iOS + Android + Web depuis un seul repo"
    sources:
      github: flutter/flutter

  - id: react-native
    name: React Native
    category: mobile
    position: trial
    since: "2024-06"
    switching_cost: high
    notes: "Mobile cross-platform pour équipes React — partage de code web/mobile"
    pros:
      - "Partage de logique avec les apps React web"
      - "Large communauté, Expo simplifie le setup"
      - "Rendu natif (pas WebView)"
    cons:
      - "Performances inférieures à Flutter sur les UIs complexes"
      - "Bridge natif — debug parfois ardu"
      - "Dépendances aux librairies natives à maintenir"
    use_cases:
      - "Apps mobiles pour équipes React souhaitant partager du code"
      - "Applications grand public avec composants natifs standard"
      - "Projets avec budget limité nécessitant iOS + Android"
    sources:
      github: facebook/react-native
      npm_package: react-native

  - id: kotlin-multiplatform
    name: Kotlin Multiplatform
    category: mobile
    position: assess
    since: "2024-06"
    switching_cost: high
    notes: "Partage de la logique business entre Android et iOS — UI reste native"
    pros:
      - "UI native sur chaque plateforme (pas de compromis)"
      - "Partage de la logique business, networking, storage"
      - "Interop Java 100% — réutilisation du code backend"
    cons:
      - "Tooling encore en maturation"
      - "Compose Multiplatform (UI) encore instable"
      - "Peu de développeurs iOS maîtrisant Kotlin"
    use_cases:
      - "Applications Android-first cherchant à partager la logique iOS"
      - "Équipes backend Kotlin voulant toucher au mobile"
      - "Applications B2B avec UI spécifiques par plateforme"
    sources:
      github: JetBrains/kotlin

  - id: capacitor
    name: Capacitor
    category: mobile
    position: assess
    since: "2024-09"
    switching_cost: low
    notes: "Wrapper natif pour apps web — déploiement sur stores depuis une PWA"
    pros:
      - "Compatible avec n'importe quel framework JS (React, Vue, Angular)"
      - "Accès aux APIs natives (camera, GPS, push notifications)"
      - "Transition PWA → App Store sans réécriture"
    cons:
      - "Performances WebView — pas adapté aux jeux ou UIs animées"
      - "Expérience utilisateur moins fluide qu'une app native"
      - "Plugins parfois mal maintenus"
    use_cases:
      - "Migration d'une PWA vers les stores iOS/Android"
      - "Applications B2B internes à distribution rapide"
      - "Prototypes mobiles depuis une base web existante"
    sources:
      github: ionic-team/capacitor
      npm_package: "@capacitor/core"

  - id: ionic
    name: Ionic
    category: mobile
    position: hold
    since: "2024-06"
    switching_cost: medium
    notes: "UI components hybrides — pertinence en recul face à Flutter et React Native"
    pros:
      - "Bibliothèque de composants UI riches"
      - "Compatible Angular, React et Vue"
      - "Capacitor intégré pour le packaging natif"
    cons:
      - "Performances inférieures aux solutions natives"
      - "Pertinence en déclin — Flutter et React Native dominent"
      - "WebView — expérience utilisateur parfois dégradée"
    use_cases:
      - "Maintenance d'applications Ionic existantes"
      - "Applications B2B internes avec équipes Angular"
      - "Éviter pour les nouveaux projets — préférer Flutter ou React Native"
    sources:
      github: ionic-team/ionic-framework
      npm_package: "@ionic/core"

  # ── DATABASES ──────────────────────────────────────────────────────────────

  - id: postgresql
    name: PostgreSQL
    category: databases
    position: adopt
    since: "2024-01"
    switching_cost: high
    experience: operated
    evidence:
      - "Vill'Âge Jeunes : plus de 30 modèles Prisma, migrations et exploitation sur VPS"
    notes: "SGBDR de référence, JSON natif, fiabilité éprouvée"
    pros:
      - "ACID complet, transactions multi-tables fiables"
      - "JSONB natif — hybride relationnel / document"
      - "Extensions (PostGIS, pgvector, TimescaleDB)"
    cons:
      - "Scalabilité horizontale en écriture complexe (Citus, Patroni)"
      - "Administration et tuning nécessitent de l'expertise"
      - "Pas conçu pour du analytique OLAP pur"
    use_cases:
      - "Base de données principale de toute application web"
      - "Données géospatiales avec PostGIS"
      - "Vecteurs AI/ML avec pgvector"
    sources:
      github: postgres/postgres

  - id: redis
    name: Redis
    category: databases
    position: adopt
    since: "2024-01"
    switching_cost: medium
    experience: studied
    evidence:
      - "Notions acquises, sans usage en production recensé"
    notes: "Cache in-memory, pub/sub, sessions — indispensable en production"
    pros:
      - "Latence sub-milliseconde — cache applicatif de référence"
      - "Structures de données riches (sorted sets, streams, HLL)"
      - "Pub/Sub et Redis Streams pour l'event-driven"
    cons:
      - "Données en RAM — coût mémoire"
      - "Modèle de données limité (pas de requêtes complexes)"
      - "Persistance optionnelle — pas une source de vérité primaire"
    use_cases:
      - "Cache de sessions et tokens JWT"
      - "Rate limiting et compteurs distribués"
      - "Queues de tâches avec BullMQ / Celery"
    sources:
      github: redis/redis

  - id: mongodb
    name: MongoDB
    category: databases
    position: trial
    since: "2024-06"
    switching_cost: medium
    notes: "Base documentaire flexible — pertinente pour les schémas évolutifs"
    pros:
      - "Schéma flexible — idéal pour les données non-structurées"
      - "Scalabilité horizontale native (sharding)"
      - "Requêtes JSON naturelles, agrégation puissante"
    cons:
      - "Risque d'anarchie du schéma sans Mongoose / validation"
      - "Jointures coûteuses (lookup) — prévoir la dénormalisation"
      - "Transactions multi-documents plus récentes et moins matures"
    use_cases:
      - "Catalogues produits avec attributs variables"
      - "CMS et contenus avec structure hétérogène"
      - "Logs applicatifs et données time-series légères"
    sources:
      github: mongodb/mongo

  - id: elasticsearch
    name: Elasticsearch
    category: databases
    position: trial
    since: "2024-06"
    switching_cost: high
    notes: "Moteur de recherche full-text + analytics — cœur de la stack ELK"
    pros:
      - "Recherche full-text ultra-rapide avec scoring de pertinence"
      - "Agrégations puissantes pour l'analytique temps réel"
      - "Kibana pour la visualisation des logs"
    cons:
      - "Consommation mémoire et CPU élevée"
      - "Cohérence éventuelle — pas adapté aux données transactionnelles"
      - "Opérations en prod complexes (sharding, réindex)"
    use_cases:
      - "Moteurs de recherche applicatifs avec pertinence"
      - "Centralisation et analyse des logs (stack ELK)"
      - "Recherche sémantique avec vecteurs dense (kNN)"
    sources:
      github: elastic/elasticsearch

  - id: clickhouse
    name: ClickHouse
    category: databases
    position: assess
    since: "2024-09"
    switching_cost: medium
    notes: "Base OLAP colonnes ultra-rapide — analytics temps réel sur milliards de lignes"
    pros:
      - "Performances analytiques 100x supérieures à PostgreSQL sur agrégats"
      - "Compression colonnes excellente — stockage réduit"
      - "SQL familier avec extensions analytiques"
    cons:
      - "Pas conçu pour l'OLTP — UPDATE/DELETE coûteux"
      - "Opérations en prod spécialisées"
      - "Jointures moins performantes que les bases row-oriented"
    use_cases:
      - "Analytics produit temps réel (clics, conversions)"
      - "Dashboards BI sur des milliards d'événements"
      - "Métriques et séries temporelles haute fréquence"
    sources:
      github: ClickHouse/ClickHouse

  # ── DEVOPS ─────────────────────────────────────────────────────────────────

  - id: docker
    name: Docker
    category: devops
    position: adopt
    since: "2024-01"
    switching_cost: low
    experience: delivered
    evidence:
      - "Calendrier du Pôle Jeunesse : deux conteneurs non-root livrés à la DSI"
      - "Exploitation finale reprise par la DSI, sans opération personnelle en production"
    notes: "Conteneurisation standard, reproductibilité des environnements"
    pros:
      - "Build once, run anywhere — reproductibilité totale"
      - "Isolation des dépendances, multi-stage builds"
      - "Docker Compose pour les environnements de développement locaux"
    cons:
      - "Overhead réseau/stockage vs processus natifs"
      - "Images non-optimisées = sécurité et taille problématiques"
      - "Rootless et daemon non activés par défaut"
    use_cases:
      - "Environnements de développement reproductibles"
      - "Build d'artefacts CI/CD déterministes"
      - "Packaging d'applications pour Kubernetes"
    sources:
      github: docker/cli

  - id: kubernetes
    name: Kubernetes
    category: devops
    position: trial
    since: "2024-03"
    switching_cost: high
    experience: observed
    evidence:
      - "Déploiement Kubernetes/GitOps préparé puis pris en charge par la DSI"
    notes: "Justifié dès 5+ services. K3s pour environnements légers."
    pros:
      - "Orchestration déclarative — self-healing, auto-scaling"
      - "Standard industrie — talent disponible"
      - "Écosystème CNCF très riche"
    cons:
      - "Complexité opérationnelle élevée — overkill < 5 services"
      - "Courbe d'apprentissage longue (RBAC, networking, storage)"
      - "Coût infra : minimum 3 nœuds pour HA"
