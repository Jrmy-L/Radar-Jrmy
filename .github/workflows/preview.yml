name: Deploy radar preview

on:
  push:
    branches:
      - feat/upgrade-radar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/upgrade-radar/

    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: feat/upgrade-radar
          path: preview

      - name: Assemble production and preview
        run: |
          cp production/data/data.json production/src/data.json
          cp preview/data/data.json preview/src/data.json
          mkdir -p production/src/preview/upgrade-radar
          cp -R preview/src/. production/src/preview/upgrade-radar/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production/src

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
